<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <title>Télécharger Gaspiz</title>
  <!-- Cible du QR code de l'affiche : envoie directement vers le bon store.
       La redirection est en JavaScript, pas dans .htaccess : le CDN Hostinger
       pourrait sinon resservir la redirection d'un iPhone à un Android. -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) location.replace('https://apps.apple.com/fr/app/gaspiz/id6738059463');
      else if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.mycompany.gaspiz');
      else location.replace('/telecharger');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; background: #FFC800; color: #141414; font-family: system-ui, sans-serif; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    img { display: block; width: 200px; height: auto; }
  </style>
</head>
<body>
  <h1>Télécharger Gaspiz</h1>
  <a href="https://apps.apple.com/fr/app/gaspiz/id6738059463"><img src="app-store.webp" alt="Télécharger dans l'App Store" width="650" height="210" /></a>
  <a href="https://play.google.com/store/apps/details?id=com.mycompany.gaspiz"><img src="play-store.webp" alt="Disponible sur Google Play" width="650" height="209" /></a>
</body>
</html>
